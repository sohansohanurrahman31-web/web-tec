<!DOCTYPE html>
<html>
<head>
    <title>Table</title>
</head>

<body>

<table border="1" cellspacing="0" cellpadding="25">

    <!-- Row 1 -->
    <tr>
        <td>AB</td>
        <td>BC</td>
        <td>CD</td>
        <td>DE</td>
    </tr>

    <!-- Row 2 -->
    <tr>
        <td rowspan="4">EF</td>
        <td colspan="3">GH</td>
    </tr>

    <!-- Row 3 -->
    <tr>
        <td colspan="2">IJ</td>
        <td rowspan="3">OP</td>
    </tr>

    <!-- Row 4 -->
    <tr>
        <td rowspan="2">KL</td>
        <td>MN</td>
    </tr>

    <!-- Row 5 -->
    <tr>
        <td>NO</td>
    </tr>

</table>

</body>
</html>
